<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>몽글 다이어리</title>
<meta name="description" content="하루 한 장, 포스트잇으로 꾸미는 다이어리">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFF4F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="몽글">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Hi+Melody&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FFF0F5;--bg2:#F5ECFF;--bg3:#EAF6FF;
  --pink:#FFD9E4;--pinkd:#FFA8C3;--pinkt:#E8799C;
  --txt:#6E5765;--dim:#B39EAC;--line:#A98E9C;
  --ui:ui-rounded,-apple-system,"SF Pro Rounded",BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
  --hand:"Hi Melody","Gaegu",ui-rounded,"Apple SD Gothic Neo",Pretendard,system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:var(--ui);color:var(--txt);overflow:hidden;
  background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:active{transform:scale(.95)}
button:focus-visible{outline:2.5px solid var(--pinkd);outline-offset:2px}
svg{display:block}
/* 손그림 스티커 공통 — 외곽선이 채움 뒤에 깔려서 스티커처럼 보임 */
.dd *{stroke:var(--line);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round;paint-order:stroke fill}
.ic{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}

#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.puff{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 32%,#fff,rgba(255,255,255,.66))}
.puff::before,.puff::after{content:"";position:absolute;border-radius:50%;background:inherit}
.puff::before{width:66%;height:66%;left:-24%;bottom:2%}
.puff::after{width:80%;height:80%;right:-28%;bottom:-4%}
@keyframes drift{from{transform:translateX(-18vw)}to{transform:translateX(118vw)}}

/* 상단 */
#top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:4px;
  padding:calc(8px + var(--st)) 10px 6px}
#top .nav{width:33px;height:33px;flex:none;border-radius:50%;background:rgba(255,255,255,.9);color:var(--pinkt);
  display:grid;place-items:center;box-shadow:0 3px 9px rgba(214,150,175,.26)}
#top .nav:disabled{opacity:.32}
#dayLabel{flex:1;text-align:center}
#dayLabel b{display:block;font-size:15.5px;font-weight:800;color:#8A6274;letter-spacing:-.01em}
#dayLabel span{font-size:10.5px;color:var(--pinkt);opacity:.85;letter-spacing:.08em}

/* 페이지 */
#stage{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  padding:calc(58px + var(--st)) 14px calc(150px + var(--sb))}
#book{position:relative;width:min(92vw,430px);aspect-ratio:3/4}
/* 뒤에 겹쳐진 속지 = 다이어리 두께 */
#book::before,#book::after{content:"";position:absolute;left:2%;right:-1.5%;top:1.2%;bottom:-1.6%;
  border-radius:12px;background:#FFF6FA;box-shadow:0 8px 16px rgba(190,140,170,.24);z-index:-2}
#book::after{left:1%;right:-.4%;top:.6%;bottom:-.7%;background:#FFFBFD;z-index:-1}
#ribbon{position:absolute;right:19%;top:-4px;width:15px;height:calc(100% + 40px);z-index:-3;
  background:linear-gradient(180deg,#FFC2D6,#FF9DB8);border-radius:2px;
  box-shadow:0 2px 5px rgba(150,110,135,.28)}
#ribbon::after{content:"";position:absolute;left:0;right:0;bottom:0;height:15px;background:var(--bg2);
  clip-path:polygon(0 100%,50% 46%,100% 100%)}
#page{position:absolute;inset:0;border-radius:12px;touch-action:none;
  box-shadow:0 16px 34px rgba(190,140,170,.3),0 2px 5px rgba(190,140,170,.2);overflow:hidden}
#grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.55;mix-blend-mode:multiply}
#pagebar{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);z-index:9;
  display:flex;align-items:center;gap:4px;padding:5px 7px;border-radius:20px;background:rgba(255,255,255,.92);
  box-shadow:0 5px 14px rgba(214,150,175,.28);white-space:nowrap}
#pagebar button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--pinkt)}
#pagebar button:disabled{opacity:.3}
#pagebar button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
#pagebar .add{width:auto;padding:0 10px;border-radius:15px;font-size:11.5px;font-weight:800;
  background:linear-gradient(160deg,#FFE6EF,#FFD3E2)}
#pagebar #pLabel{font-size:11.5px;font-weight:700;color:var(--dim);padding:0 3px;font-family:var(--mono)}
#pop{position:absolute;right:3%;top:12%;z-index:12;display:none;flex-wrap:wrap;justify-content:center;
  align-items:center;gap:4px;padding:9px;max-width:min(78vw,300px);
  border-radius:20px;background:#fff;box-shadow:0 10px 24px rgba(190,140,170,.36)}
#pop button{width:60px;border-radius:14px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9.5px;color:var(--dim);font-weight:700}
#pop button svg{width:34px;height:34px}
#pop button[aria-pressed="true"]{background:linear-gradient(160deg,#FFE6EF,#FFD3E2)}
#pop .clr{width:auto;padding:0 9px;font-size:11px;color:var(--dim);font-weight:700}
#margin{position:absolute;left:10.5%;top:0;bottom:0;width:1.4px;background:rgba(255,150,180,.45);z-index:1;pointer-events:none}
#page.draw{cursor:crosshair}
#pageHead{position:absolute;left:10.5%;right:5.5%;top:0;height:12.5%;display:flex;align-items:center;
  justify-content:space-between;padding:0 0 0 4%;z-index:2}
#pageHead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  border-top:1.4px solid rgba(150,110,135,.28);border-bottom:1px solid rgba(150,110,135,.16)}
#pageHead .dt{display:flex;align-items:baseline;gap:7px;pointer-events:none}
#pageHead .d{font-family:var(--hand);font-size:23px;color:rgba(120,88,105,.72);letter-spacing:.02em}
#pageHead .w{font-size:10.5px;letter-spacing:.18em;color:rgba(120,88,105,.45)}
#pageHead .marks{display:flex;gap:5px}
#pageHead .marks button{width:30px;height:30px;border-radius:11px;background:rgba(255,255,255,.6);
  display:grid;place-items:center;padding:3px;box-shadow:inset 0 0 0 1.3px rgba(150,110,135,.18)}
#pageHead .marks button svg{width:100%;height:100%}
#pageHead .marks button.empty{color:rgba(150,110,135,.45);font-size:9.5px;font-family:var(--ui);font-weight:700;
  white-space:nowrap;letter-spacing:-.03em}
#rules{position:absolute;left:10.5%;right:5.5%;top:12.5%;bottom:3%;pointer-events:none;z-index:0}
#bodyMemo{position:absolute;left:12%;right:6%;top:13.2%;bottom:3.5%;z-index:2;background:none;border:0;
  resize:none;outline:none;padding:0;color:#5C4A55;font-family:var(--hand);font-size:17px;line-height:30.6px;
  caret-color:var(--pinkd);overflow:hidden}
#bodyMemo::placeholder{color:rgba(150,110,135,.32)}
#page.draw #bodyMemo{pointer-events:none}
#cv,#cvLive{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#cvLive{z-index:6}

.el{position:absolute;transform-origin:center;z-index:4;touch-action:none}
.el.sel{z-index:7}
.el .frame{position:absolute;inset:-7px;border:1.8px dashed var(--pinkd);border-radius:10px;display:none}
.el.sel .frame{display:block}
.el .hx,.el .hs{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;display:none;
  place-items:center;box-shadow:0 2px 7px rgba(190,140,170,.42);color:var(--pinkt)}
.el.sel .hx{display:grid;left:-15px;top:-15px}
.el.sel .hs{display:grid;right:-15px;bottom:-15px}
.el .hz{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;display:none;place-items:center;
  box-shadow:0 2px 7px rgba(190,140,170,.42);color:var(--pinkt);right:-15px;top:-15px}
.el.sel .hz{display:grid}
.el .hz svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.el .hx svg,.el .hs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:8;stroke-linecap:round}
.noteel,.stickerel{aspect-ratio:1/1}
.note{position:relative}
.note .bg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(180,135,160,.32))}
.note .tx,.textel .tx{position:absolute;font-family:var(--hand);color:#6B5563;line-height:1.35;
  overflow:hidden;outline:none;white-space:pre-wrap;word-break:break-word}
.textel .tx{position:relative;padding:2px 4px}
.photoel{padding:5.5% 5.5% 16%;background:#fff;border-radius:3px;box-shadow:0 5px 11px rgba(180,135,160,.34)}
.photoel img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:1px}
.stickerel svg{width:100%;height:100%}

/* 하단 */
#dockwrap{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:0 10px calc(10px + var(--sb))}
#tray{position:absolute;left:10px;right:10px;bottom:calc(100% - 4px);z-index:9;
  display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:11px 12px 13px;
  max-height:44vh;overflow-y:auto;border-radius:22px;background:rgba(255,255,255,.96);
  box-shadow:0 -6px 22px rgba(214,150,175,.3)}
#tray::-webkit-scrollbar{display:none}
.trayrow{display:flex;align-items:center;gap:8px;overflow-x:auto}
.trayrow::-webkit-scrollbar{display:none}
.slider{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;border-radius:17px;
  background:rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(214,150,175,.2)}
.slider input{width:112px;accent-color:var(--pinkd);background:transparent}
.slider .prev{width:30px;height:30px;display:grid;place-items:center;flex:none}
.slider .prev i{display:block;border-radius:99px}
.picker{flex:none;display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:18px;
  background:rgba(255,255,255,.92);box-shadow:0 3px 8px rgba(214,150,175,.22)}
.picker input[type=range]{-webkit-appearance:none;appearance:none;height:15px;border-radius:99px;background:transparent}
.picker input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(150,110,135,.5);border:2.5px solid #fff;cursor:pointer}
.picker input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#fff;border:2.5px solid #fff;
  box-shadow:0 2px 6px rgba(150,110,135,.5)}
.hue{width:132px;background:linear-gradient(90deg,#FF6B7E,#FFA95F,#FFE55F,#7FE08A,#5FD3E0,#6F92F5,#B47FF0,#FF6BA8,#FF6B7E)!important}
.tone{width:96px}
.myc{flex:none;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#FF8DA1,#FFC48D,#FFEC8D,#9BE3A8,#8DD6E8,#A9A8F0,#D79BEF,#FF8DA1);
  box-shadow:0 2px 6px rgba(180,135,160,.3)}
.myc span{width:13px;height:13px;border-radius:50%;background:#fff}
.myc[aria-pressed="true"]{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--pinkd)}
.sw.my{position:relative}
.sw.my::after{content:"";position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1.6px var(--pinkd)}
#tray:empty{display:none}
#dockwrap{position:relative}
#dockwrap{position:absolute}
#dock{display:flex;align-items:center;justify-content:space-around;gap:2px;padding:7px 6px;
  background:rgba(255,255,255,.92);border-radius:24px;box-shadow:0 8px 20px rgba(214,150,175,.28)}
.tb{flex:1;height:50px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--dim);font-size:9.5px;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.tb[aria-pressed="true"]{background:linear-gradient(160deg,#FFE6EF,#FFD3E2);color:var(--pinkt);font-weight:800;
  transform:translateY(-3px);box-shadow:0 5px 10px rgba(255,150,185,.28)}
.chip{flex:none;padding:9px 13px;border-radius:16px;background:rgba(255,255,255,.9);color:var(--dim);font-size:13px;
  white-space:nowrap;box-shadow:0 3px 8px rgba(214,150,175,.2)}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,#FFE6EF,#FFD3E2);color:var(--pinkt);font-weight:800}
.sw{flex:none;width:29px;height:29px;border-radius:50%;box-shadow:0 2px 6px rgba(180,135,160,.26),inset 0 0 0 1.5px rgba(255,255,255,.85)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--pinkd)}
.cell{flex:none;width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.9);display:grid;place-items:center;
  padding:6px;box-shadow:0 3px 8px rgba(214,150,175,.2)}
.cell svg{width:100%;height:100%}
.cell[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--pinkd)}
.lead{flex:none;font-size:9.5px;letter-spacing:.14em;color:var(--dim)}

/* 달력 */
#cal{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  background:linear-gradient(170deg,var(--bg1),var(--bg2))}
#cal.on{display:flex}
.chead{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--st)) 18px 10px}
.chead h2{margin:0;font-size:20px;color:#8A6274}
.chead .x{padding:8px 14px;border-radius:16px;background:#fff;color:var(--pinkt);font-size:13px;font-weight:700;
  box-shadow:0 3px 8px rgba(214,150,175,.24)}
.cnav{display:flex;align-items:center;gap:8px}
.cnav button{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--pinkt);display:grid;place-items:center;
  box-shadow:0 3px 8px rgba(214,150,175,.22)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:6px 14px calc(24px + var(--sb));overflow-y:auto}
.dow{text-align:center;font-size:10px;color:var(--dim);padding-bottom:2px}
.cellday{position:relative;aspect-ratio:3/4;border-radius:9px;background:rgba(255,255,255,.6);display:flex;
  align-items:flex-start;justify-content:center;padding-top:4px;font-size:11px;color:var(--dim);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.cellday.has{box-shadow:0 3px 8px rgba(214,150,175,.28)}
.cellday.today{outline:2px solid var(--pinkd);outline-offset:1px}
.cellday .n{position:absolute;bottom:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--pinkd)}
.cellday .pgn{position:absolute;top:3px;right:4px;font-size:8.5px;color:var(--pinkt);font-weight:800}
.cellday .face{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:66%}
.cellday .face svg{width:100%;height:100%}
.cellday.blank{background:none;box-shadow:none}

#syncDot{position:absolute;right:12px;bottom:calc(96px + var(--sb));z-index:50;font-size:10.5px;
  color:var(--pinkt);background:rgba(255,255,255,.9);padding:5px 10px;border-radius:99px;opacity:0;
  transition:opacity .25s;pointer-events:none;box-shadow:0 3px 8px rgba(214,150,175,.25)}
.mode{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:99px;background:#F3EEF4;
  font-size:10.5px;font-weight:700;color:var(--dim)}
.mode.on{background:#DFF3E7;color:#3F9E74}
#auth{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
#auth.on{display:flex}
.acard{width:min(92vw,360px);background:rgba(255,255,255,.92);border-radius:26px;padding:24px 22px 20px;
  box-shadow:0 16px 34px rgba(214,150,175,.3)}
.acard h2{margin:0 0 4px;font-size:21px;color:#8A6274}
.acard p{margin:0 0 16px;font-size:12.5px;color:var(--dim);line-height:1.6}
.acard input{width:100%;padding:13px 15px;border-radius:15px;border:1.6px solid rgba(255,168,195,.5);
  background:#fff;color:var(--txt);font-family:inherit;font-size:15px;margin-bottom:9px}
.acard input:focus{outline:none;border-color:var(--pinkd);box-shadow:0 0 0 3px rgba(255,168,195,.22)}
.pwrap{position:relative}
.pwrap input{padding-right:50px}
.eye{position:absolute;right:8px;top:6px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--dim)}
.eye svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.eye[aria-pressed="true"]{color:var(--pinkt)}
.acard input.code{text-align:center;letter-spacing:.5em;font-size:22px;font-weight:800;padding-left:.5em}
.abtn{width:100%;padding:14px;border-radius:17px;background:linear-gradient(135deg,#FFC2D4,#FFAFC9);color:#fff;
  font-weight:800;font-size:15px;box-shadow:0 6px 14px rgba(255,140,175,.4);margin-top:5px}
.gbtn{width:100%;padding:13px;border-radius:17px;background:#fff;color:#4A4A55;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 0 0 1.6px #E8DCE4 inset,0 4px 12px rgba(214,150,175,.22);margin-bottom:4px}
.gbtn svg{width:19px;height:19px;flex:none}
.orline{display:flex;align-items:center;gap:10px;margin:13px 0 9px;color:var(--dim);font-size:11px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:#EFE4EB}
.abtn.ghost{background:#fff;color:var(--pinkt);box-shadow:0 0 0 2px var(--pink) inset,0 4px 10px rgba(214,150,175,.2);margin-top:9px}
.alink{width:100%;padding:11px;font-size:12.5px;color:var(--dim);margin-top:2px}
.aerr{font-size:12px;color:#E8697F;min-height:17px;margin:2px 0 0;font-weight:700}
.codebox{background:#FFF4F8;border:1.4px dashed var(--pinkd);border-radius:14px;padding:10px;text-align:center;
  font-size:12.5px;color:var(--pinkt);margin-bottom:12px;line-height:1.6}
.codebox b{font-size:20px;letter-spacing:.35em;display:block;margin-top:3px}
.logo{text-align:center;margin-bottom:18px}
.logo b{font-size:27px;color:#8A6274;letter-spacing:-.02em}
.logo span{display:block;font-size:11px;color:var(--pinkt);letter-spacing:.24em;margin-top:2px}
.who{position:absolute;left:18px;bottom:calc(16px + var(--sb));font-size:11px;color:var(--dim)}
#toast{position:absolute;left:50%;bottom:160px;transform:translate(-50%,10px);z-index:30;background:#fff;
  color:var(--pinkt);font-weight:700;padding:10px 17px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;
  box-shadow:0 6px 18px rgba(214,150,175,.34);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div id="sky"></div>

<div id="top">
  <button class="nav" id="prevD" aria-label="어제"></button>
  <div id="dayLabel"><b>8월 22일 토요일</b><span>TODAY</span></div>
  <button class="nav" id="undoBtn" aria-label="되돌리기"></button>
  <button class="nav" id="redoBtn" aria-label="다시 실행"></button>
  <button class="nav" id="saveBtn" aria-label="이미지로 저장"></button>
  <button class="nav" id="calBtn" aria-label="달력"></button>
  <button class="nav" id="nextD" aria-label="내일"></button>
</div>

<div id="stage">
  <div id="book">
    <div id="ribbon"></div>
    <div id="page">
      <div id="margin"></div>
      <div id="pageHead">

  return sbFetch("/rest/v1/kv?select=v&k=eq."+encodeURIComponent(k),{method:"GET"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(rows){ syncFlag(-1); return (rows&&rows.length)?rows[0].v:undefined; })
    .catch(function(){ syncFlag(-1); return undefined; });
}
var pushQ={},pushT=null;
function sbSet(k,v){
  pushQ[k]=v;
  clearTimeout(pushT);
  pushT=setTimeout(flushQ,400);
}
function flushQ(){
  var rows=Object.keys(pushQ).map(function(k){ return {k:k,v:pushQ[k],updated_at:new Date().toISOString()}; });
  if(!rows.length) return;
  pushQ={}; syncFlag(1);
  sbFetch("/rest/v1/kv?on_conflict=user_id,k",{
    method:"POST",
    headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify(rows)
  }).then(function(r){
    syncFlag(-1);
    if(!r.ok) rows.forEach(function(o){ if(!(o.k in pushQ)) pushQ[o.k]=o.v; });
  }).catch(function(){
    syncFlag(-1);
    rows.forEach(function(o){ if(!(o.k in pushQ)) pushQ[o.k]=o.v; });
  });
}
window.addEventListener("beforeunload",function(){ if(cloudOn()) flushQ(); });

var store={
  get:function(k){
    if(!cloudOn()) return localGet(k);
    return sbGet(k).then(function(v){
      if(v!==undefined&&v!==null){ localSet(k,v); return v; }
      return localGet(k);
    });
  },
  set:function(k,v){
    localSet(k,v);
    if(cloudOn()) sbSet(k,v);
    return Promise.resolve();
  }
};

function buildCursors(done){
  var keys=Object.keys(CURSVG), left=keys.length;
  keys.forEach(function(k){
    var im=new Image();
    im.onload=function(){
      try{
        var c=document.createElement("canvas"); c.width=c.height=36;
        c.getContext("2d").drawImage(im,0,0,36,36);

function hsl2hex(h,s,l){
  s/=100; l/=100;
  var k=function(n){return (n+h/30)%12;}, a=s*Math.min(l,1-l);
  var f=function(n){ return Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))); };
  return "#"+[f(0),f(8),f(4)].map(function(v){return v.toString(16).padStart(2,"0");}).join("");
}

function applyHist(a){
  if(a.t==="add"){
    var idx=D.items.indexOf(a.it);
    D.items=D.items.filter(function(x){return x!==a.it;});
    var e=elOf(a.it.id); if(e) e.remove();
    if(T.sel===a.it) T.sel=null;
    return {t:"del",it:a.it,idx:idx};
  }
  if(a.t==="del"){
    D.items.splice(Math.min(a.idx,D.items.length),0,a.it);
    mountItem(a.it);
    return {t:"add",it:a.it};
  }
  if(a.t==="geo"){
    var cur={x:a.it.x,y:a.it.y,w:a.it.w,rot:a.it.rot};
    a.it.x=a.prev.x; a.it.y=a.prev.y; a.it.w=a.prev.w; a.it.rot=a.prev.rot;
    var d=elOf(a.it.id);
    if(d){ place(d,a.it);
      if(a.it.type==="note") noteText(d,a.it);
      if(a.it.type==="text") d.querySelector(".tx").style.fontSize=Math.max(12,pageRect().width*a.it.w/100*.5)+"px"; }
    return {t:"geo",it:a.it,prev:cur};
  }
  if(a.t==="text"){
    var curT=a.it.text||"";
    a.it.text=a.prev;
    var dt=elOf(a.it.id); if(dt) dt.querySelector(".tx").textContent=a.prev;
    return {t:"text",it:a.it,prev:curT};
  }
  if(a.t==="color"){
    var curC=a.it.color;
    a.it.color=a.prev;
    var dc=elOf(a.it.id);
    if(dc){ if(a.it.type==="note") refreshNote(a.it); else dc.querySelector(".tx").style.color=a.prev; }
    return {t:"color",it:a.it,prev:curC};
  }
  if(a.t==="strokes"){
    var removed=[];
    a.list.forEach(function(o){
      var k=D.strokes.indexOf(o.s);
      if(k>=0){ removed.push({i:k,s:o.s}); D.strokes.splice(k,1); }
    });
    redraw();
    return {t:"erase",items:removed};
  }
  if(a.t==="erase"){
    a.items.slice().sort(function(x,y){return x.i-y.i;}).forEach(function(o){
      D.strokes.splice(Math.min(o.i,D.strokes.length),0,o.s);
    });
    redraw();
    return {t:"strokes",list:a.items};
  }
  if(a.t==="memo"){
    var curM=$("bodyMemo").value;
    $("bodyMemo").value=a.prev;
    return {t:"memo",prev:curM};
  }
  if(a.t==="paper"){
    var curP={paper:D.paper,pattern:D.pattern};
    D.paper=a.prev.paper; D.pattern=a.prev.pattern; applyPaper(); renderTray();
    return {t:"paper",prev:curP};
  }
  return null;
}

function seeded(s){ var x=s>>>0; return function(){ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }
function drawStroke(ctx,s){
  var p=s.pts;
  if(!p.length) return;
  if(s.tool==="pencil"){
    var rnd=seeded(s.seed||7), r=s.w*.62;
    ctx.fillStyle=s.color;
    for(var i=1;i<p.length;i++){
      var d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
      var n=Math.max(1,Math.ceil(d/(r*.5)));
      for(var k=1;k<=n;k++){
        var x=p[i-1][0]+(p[i][0]-p[i-1][0])*k/n, y=p[i-1][1]+(p[i][1]-p[i-1][1])*k/n;
        for(var q=0;q<3;q++){
          var a=rnd()*6.2832, dd=Math.pow(rnd(),.6)*r;
          ctx.globalAlpha=.05+rnd()*.14;
          var sz=.9+rnd()*r*.5;
          ctx.fillRect(x+Math.cos(a)*dd-sz/2,y+Math.sin(a)*dd-sz/2,sz,sz);
        }
      }
    }
    ctx.globalAlpha=1; return;
  }
  if(s.tool==="hl"){
    ctx.save();
    ctx.globalCompositeOperation="multiply";
    ctx.globalAlpha=.34;
    ctx.strokeStyle=s.color; ctx.lineWidth=s.w; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath();
    if(p.length<2){ ctx.moveTo(p[0][0],p[0][1]); ctx.lineTo(p[0][0]+.01,p[0][1]); }
    else{ ctx.moveTo(p[0][0],p[0][1]); for(var h=1;h<p.length;h++) ctx.lineTo(p[h][0],p[h][1]); }
    ctx.stroke(); ctx.restore(); return;
  }
  ctx.save();
  ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
  ctx.lineWidth=s.w; ctx.lineCap="round"; ctx.lineJoin="round";
  if(p.length<2){ ctx.beginPath(); ctx.arc(p[0][0],p[0][1],s.w*.55,0,6.2832); ctx.fill(); ctx.restore(); return; }
  ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
  for(var j=1;j<p.length-1;j++){
    ctx.quadraticCurveTo(p[j][0],p[j][1],(p[j][0]+p[j+1][0])/2,(p[j][1]+p[j+1][1])/2);
  }
  ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);
  ctx.stroke();
  ctx.globalAlpha=.4; ctx.beginPath(); ctx.arc(p[0][0],p[0][1],s.w*.56,0,6.2832); ctx.fill();
  ctx.restore();
}
function redraw(){
  cx.clearRect(0,0,CW,CH);
  D.strokes.forEach(function(s){ if(s.tool==="hl") drawStroke(cx,s); });
  D.strokes.forEach(function(s){ if(s.tool!=="hl") drawStroke(cx,s); });
}

function place(d,it){

function select(it){

    e.classList.toggle("sel",!!it&&e.dataset.id===it.id);
  });

function elOf(id){ return $("page").querySelector('[data-id="'+id+'"]'); }

function wire(d,it){
  var mode=null,sx,sy,ox,oy,ow,orot,cxp,cyp,startAng,startDist,geoStart=null;
  d.addEventListener("pointerdown",function(e){
    if(T.drawMode) return;
    e.stopPropagation();
    var tgt=e.target.closest("button");
    if(tgt&&tgt.classList.contains("hx")){ removeItem(it); return; }
    if(tgt&&tgt.classList.contains("hz")){ swapZ(it); return; }
    select(it);
    var r=pageRect(), dr=d.getBoundingClientRect();
    cxp=dr.left+dr.width/2; cyp=dr.top+dr.height/2;
    sx=e.clientX; sy=e.clientY; ox=it.x; oy=it.y; ow=it.w; orot=it.rot;
    geoStart={x:it.x,y:it.y,w:it.w,rot:it.rot};
    if(tgt&&tgt.classList.contains("hs")){
      mode="scale";
      startAng=Math.atan2(e.clientY-cyp,e.clientX-cxp);
      startDist=Math.hypot(e.clientX-cxp,e.clientY-cyp);
    }else mode="move";
    try{ d.setPointerCapture(e.pointerId); }catch(err){}
  });
  d.addEventListener("pointermove",function(e){
    if(!mode) return;
    var r=pageRect();
    if(mode==="move"){
      it.x=clamp(ox+(e.clientX-sx)/r.width*100,2,98);
      it.y=clamp(oy+(e.clientY-sy)/r.height*100,2,98);
    }else{
      var dist=Math.hypot(e.clientX-cxp,e.clientY-cyp);
      var ang=Math.atan2(e.clientY-cyp,e.clientX-cxp);
      it.w=clamp(ow*(dist/Math.max(8,startDist)),8,96);
      it.rot=+(orot+(ang-startAng)*57.3).toFixed(1);
    }
    place(d,it);
    if(it.type==="note") noteText(d,it);
    if(it.type==="text") d.querySelector(".tx").style.fontSize=Math.max(12,r.width*it.w/100*.5)+"px";
  });
  function up(){
    if(!mode) return; mode=null;
    if(geoStart&&(geoStart.x!==it.x||geoStart.y!==it.y||geoStart.w!==it.w||geoStart.rot!==it.rot))
      hpush({t:"geo",it:it,prev:geoStart});
    geoStart=null; saveDay();
  }
  d.addEventListener("pointerup",up);
  d.addEventListener("pointercancel",up);
  var tx=d.querySelector(".tx");
  if(tx){
    d.addEventListener("dblclick",function(){ editText(tx,it); });
    var lastTap=0;
    d.addEventListener("pointerup",function(){
      var n=Date.now();
      if(n-lastTap<330) editText(tx,it);
      lastTap=n;
    });
  }
}
function editText(tx,it){
  if(T.drawMode) return;
  var before=it.text||"";
  tx.contentEditable="true";
  tx.focus();
  var range=document.createRange(); range.selectNodeContents(tx);
  var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  tx.onblur=function(){
    tx.contentEditable="false";
    it.text=tx.innerText.replace(/\n{3,}/g,"\n\n");
    tx.textContent=it.text;
    if(it.text!==before) hpush({t:"text",it:it,prev:before});
    saveDay();
  };
}
function swapZ(it){
  var i=D.items.indexOf(it), d=elOf(it.id);
  if(i<0||!d) return;
  D.items.splice(i,1);
  if(i>0){ D.items.unshift(it); $("page").insertBefore(d,$("page").querySelector(".el")); toast("뒤로 보냈어요"); }
  else { D.items.push(it); $("page").appendChild(d); toast("앞으로 꺼냈어요"); }
  saveDay();
}
function removeItem(it){
  var idx=D.items.indexOf(it);
  D.items=D.items.filter(function(x){return x!==it;});
  var e=elOf(it.id); if(e) e.remove();
  T.sel=null; hpush({t:"del",it:it,idx:idx}); saveDay();
}
function addItem(it){
  it.id=uid();

var drawing=false,curStroke=null,eraseBatch=null;
function toCv(e){
  var r=pageRect();
  return [(e.clientX-r.left)/r.width*CW,(e.clientY-r.top)/r.height*CH];
}
$("page").addEventListener("pointerdown",function(e){
  if(!T.drawMode) return;
  var p=toCv(e);
  if(T.pen==="eraser"){ drawing=true; eraseBatch=[]; eraseAt(p); return; }
  drawing=true;
  var scale=CW/pageRect().width;
  var col=T.pen==="pencil"?T.pencilColor:(T.pen==="hl"?T.hlColor:T.ink);
  curStroke={tool:T.pen,color:col,
    w:T.size[T.pen]*scale*.47,pts:[p],seed:(Math.random()*1e9)|0};
  lx.clearRect(0,0,CW,CH); drawStroke(lx,curStroke);
  try{ $("page").setPointerCapture(e.pointerId); }catch(err){}
});
$("page").addEventListener("pointermove",function(e){
  if(!drawing) return;
  var evs=(typeof e.getCoalescedEvents==="function")?e.getCoalescedEvents():null;
  var list=(evs&&evs.length)?evs:[e];
  for(var i=0;i<list.length;i++){
    var p=toCv(list[i]);
    if(T.pen==="eraser"){ eraseAt(p); continue; }
    var lp=curStroke.pts[curStroke.pts.length-1];
    if(Math.hypot(p[0]-lp[0],p[1]-lp[1])<2.2) continue;
    curStroke.pts.push([lp[0]+(p[0]-lp[0])*.72,lp[1]+(p[1]-lp[1])*.72]);
  }
  if(T.pen!=="eraser"){ lx.clearRect(0,0,CW,CH); drawStroke(lx,curStroke); }
});
function endDraw(){
  if(!drawing) return; drawing=false;
  if(curStroke){ D.strokes.push(curStroke); hpush({t:"strokes",list:[{i:D.strokes.length-1,s:curStroke}]}); curStroke=null; lx.clearRect(0,0,CW,CH); redraw(); }
  if(eraseBatch&&eraseBatch.length){ hpush({t:"erase",items:eraseBatch}); }
  eraseBatch=null;
  saveDay();
}
$("page").addEventListener("pointerup",endDraw);
$("page").addEventListener("pointercancel",endDraw);
function eraseAt(p){
  var r=T.size.eraser*(CW/Math.max(1,pageRect().width))*.47*1.6, hit=false;
  D.strokes=D.strokes.filter(function(s,idx){
    for(var i=0;i<s.pts.length;i++){
      if(Math.hypot(s.pts[i][0]-p[0],s.pts[i][1]-p[1])<r+s.w){
        if(eraseBatch) eraseBatch.push({i:idx,s:s});
        hit=true; return false;
      }
    }
    return true;
  });
  if(hit) redraw();
}

function wireStickerDrag(b,rowEl){
  var hold=null,dragging=false,startX=0,ox=0;
  b.addEventListener("pointerdown",function(e){
    startX=e.clientX; delete b.dataset.moved;
    hold=setTimeout(function(){
      dragging=true;
      b.style.transition="none"; b.style.transform="scale(1.16)";
      b.style.zIndex="5"; b.style.boxShadow="0 8px 18px rgba(190,140,170,.45)";
      if(navigator.vibrate) navigator.vibrate(12);
      try{ b.setPointerCapture(e.pointerId); }catch(err){}
    },300);
  });
  b.addEventListener("pointermove",function(e){
    if(!dragging){
      if(Math.abs(e.clientX-startX)>8){ clearTimeout(hold); }
      return;
    }
    b.dataset.moved="1";
    var dx=e.clientX-startX;
    b.style.transform="scale(1.16) translateX("+dx+"px)";
    var cells=Array.prototype.slice.call(rowEl.querySelectorAll(".cell"));
    var mid=b.getBoundingClientRect().left+b.offsetWidth/2;
    for(var i=0;i<cells.length;i++){
      var c=cells[i]; if(c===b) continue;
      var r=c.getBoundingClientRect();
      if(mid>r.left&&mid<r.right){
        var idxB=cells.indexOf(b);
        if(i<idxB) rowEl.insertBefore(b,c); else rowEl.insertBefore(b,c.nextSibling);
        startX=e.clientX; b.style.transform="scale(1.16)";
        break;
      }
    }
  });
  function end(){
    clearTimeout(hold);
    if(dragging){
      dragging=false;
      b.style.transition=""; b.style.transform=""; b.style.zIndex=""; b.style.boxShadow="";
      T.stickerOrder=Array.prototype.slice.call(rowEl.querySelectorAll(".cell")).map(function(c){return c.dataset.k;});

function svgImg(svg){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){ res(im); };
    im.onerror=function(){ res(null); };
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}
function imgOf(src){
  return new Promise(function(res){
    var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){res(null);}; im.src=src;
  });
}
function wrapLines(o,text,maxW){
  var out=[];
  String(text||"").split("\n").forEach(function(par){
    if(!par){ out.push(""); return; }
    var line="";
    for(var i=0;i<par.length;i++){
      var t=line+par[i];
      if(o.measureText(t).width>maxW&&line){ out.push(line); line=par[i]; }
      else line=t;
    }
    out.push(line);
  });
  return out;
}
function exportDay(){
  var W=1000,H=1333,o,c=document.createElement("canvas");
  c.width=W; c.height=H; o=c.getContext("2d");
  var hand=getComputedStyle(document.body).getPropertyValue("--hand").trim()||"sans-serif";
  var L=W*.105, R=W*.945, TOPY=H*.125, BOT=H*.97;
  o.fillStyle=D.paper; o.fillRect(0,0,W,H);
  /* 무늬 */
  o.strokeStyle="rgba(150,110,135,.16)"; o.lineWidth=1.6;
  if(D.pattern==="line"||D.pattern==="grid"){
    var step=D.pattern==="line"?44:40;
    for(var y=TOPY+step;y<BOT;y+=step){ o.beginPath(); o.moveTo(L,y); o.lineTo(R,y); o.stroke(); }
  }
  if(D.pattern==="grid"){
    for(var x=L;x<R;x+=40){ o.beginPath(); o.moveTo(x,TOPY); o.lineTo(x,BOT); o.stroke(); }
  }
  if(D.pattern==="dot"){
    o.fillStyle="rgba(150,110,135,.22)";
    for(var dx=L;dx<R;dx+=34) for(var dy=TOPY+10;dy<BOT;dy+=34){ o.beginPath(); o.arc(dx,dy,2.2,0,6.2832); o.fill(); }
  }
  /* 여백선 + 헤더선 */
  o.strokeStyle="rgba(255,150,180,.5)"; o.lineWidth=2;
  o.beginPath(); o.moveTo(L,0); o.lineTo(L,H); o.stroke();
  o.strokeStyle="rgba(150,110,135,.3)"; o.lineWidth=2.4;
  o.beginPath(); o.moveTo(L,TOPY); o.lineTo(R,TOPY); o.stroke();
  o.strokeStyle="rgba(150,110,135,.18)"; o.lineWidth=1.6;
  o.beginPath(); o.moveTo(L,TOPY+7); o.lineTo(R,TOPY+7); o.stroke();
  /* 날짜 */
  var d=parseKey(D.key);
  o.fillStyle="rgba(120,88,105,.75)"; o.textBaseline="alphabetic"; o.textAlign="left";
  o.font="58px "+hand;
  o.fillText((d.getMonth()+1)+" / "+d.getDate(),L+26,TOPY-28);

    });
  }
  var tasks=[];
  /* 날씨·기분 */
  [D.weather,D.mood].forEach(function(k,i){
    if(!k) return;
    tasks.push(svgImg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><g stroke="#A98E9C" stroke-width="3.4" stroke-linejoin="round" style="paint-order:stroke fill">'+ART[k]+'</g></svg>')
      .then(function(im){ if(im) o.drawImage(im,R-160+i*76,TOPY-92,68,68); }));
  });
  /* 낙서 */
  tasks.push(Promise.resolve().then(function(){ o.drawImage(cv,0,0,W,H); }));
  /* 요소 */
  D.items.forEach(function(it){
    var px=it.x/100*W, py=it.y/100*H, size=it.w/100*W, rot=(it.rot||0)*Math.PI/180;
    if(it.type==="sticker"){
      tasks.push(svgImg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><g stroke="#A98E9C" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" style="paint-order:stroke fill">'+ART[it.art]+'</g></svg>')
        .then(function(im){ if(!im) return;
          o.save(); o.translate(px,py); o.rotate(rot); o.drawImage(im,-size/2,-size/2,size,size); o.restore(); }));
    }else if(it.type==="photo"){
      tasks.push(imgOf(it.src).then(function(im){ if(!im) return;
        var pad=size*.055, inner=size-pad*2, h=inner+pad+size*.16;
        o.save(); o.translate(px,py); o.rotate(rot);
        o.shadowColor="rgba(180,135,160,.34)"; o.shadowBlur=size*.06; o.shadowOffsetY=size*.02;
        o.fillStyle="#fff"; o.fillRect(-size/2,-h/2,size,h);

        o.restore(); }));
    }else if(it.type==="note"){
      var sh=SHAPES[it.shape]||SHAPES.square;
      tasks.push(svgImg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300" fill="'+it.color+'">'+sh.svg+'</svg>')
        .then(function(im){
          o.save(); o.translate(px,py); o.rotate(rot);
          if(im) o.drawImage(im,-size/2,-size/2,size,size);

    }else{

        o.restore(); }));
    }
  });
  toast("카드 만드는 중…");
  Promise.all(tasks).then(function(){

    }catch(e){ toast("저장에 실패했어요"); }
  });
}

function sha(t){
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode("monggle:"+t)).then(function(bf){
      return Array.prototype.map.call(new Uint8Array(bf),function(x){return x.toString(16).padStart(2,"0");}).join("");
    }).catch(function(){ return simpleHash(t); });
  }
  return Promise.resolve(simpleHash(t));
}
function simpleHash(t){
  var h=5381; t="monggle:"+t;
  for(var i=0;i<t.length;i++) h=((h*33)^t.charCodeAt(i))>>>0;
  return "s"+h.toString(16);
}

      '<button class="alink" id="aBack">다른 이메일로 새로 가입</button>';
    $("aGo").onclick=function(){ A.step="login"; renderAuth(); };
    $("aBack").onclick=function(){ A.step="signup"; renderAuth(); };

  }else if(A.step==="code"){
    c.innerHTML='<h2>인증번호 확인</h2>'+
      '<p><b>'+A.mail+'</b> 로 6자리 숫자를 보냈어요'+(A.recover?'<br>확인하면 새 비밀번호를 만들어요':'')+'</p>'+
      (cloudReady()?'':'<div class="codebox">연동이 꺼져 있어 메일 대신 여기에 떠요<b>'+A.code+'</b></div>')+
      '<input id="aCode" class="code" inputmode="numeric" maxlength="6" placeholder="······">'+
      '<p class="aerr" id="aErr"></p>'+
      '<button class="abtn" id="aGo">확인</button>'+
      '<button class="alink" id="aRe">인증번호 다시 보내기</button>'+
      '<button class="alink" id="aBack">이메일 다시 입력</button>';
    $("aGo").onclick=checkCode;
    $("aCode").oninput=function(){ aerr(""); if(this.value.length===6) checkCode(); };
    $("aRe").onclick=function(){ (A.recover?sendRecover:sendCode)(); };
    $("aBack").onclick=function(){ A.step=A.recover?"find":"signup"; renderAuth(); };
    setTimeout(function(){ var e=$("aCode"); if(e) e.focus(); },200);

  }else{
    c.innerHTML='<h2>'+(A.recover?"새 비밀번호 만들기":"비밀번호 만들기")+'</h2>'+
      '<p>'+A.mail+'<br>6자 이상, 두 번 똑같이 입력해 주세요</p>'+
      pwField("aPw","비밀번호","new-password")+
      pwField("aPw2","비밀번호 확인","new-password")+
      '<p class="aerr" id="aErr"></p>'+
      '<button class="abtn" id="aGo">'+(A.recover?"바꾸고 시작하기":"가입하고 시작하기")+'</button>'+
      '<button class="alink" id="aBack">뒤로</button>';
    wireEyes();
    $("aGo").onclick=setNewPw;
    $("aPw2").onkeydown=function(e){ if(e.key==="Enter") setNewPw(); };
    $("aBack").onclick=function(){ A.direct=false; A.step=A.recover?"login":"signup"; renderAuth(); };
  }
}
function pwField(id,ph,auto){
  return '<div class="pwrap"><input id="'+id+'" type="password" autocomplete="'+auto+'" placeholder="'+ph+'">'+
    '<button class="eye" data-for="'+id+'" aria-pressed="false" aria-label="비밀번호 보기">'+
    '<svg viewBox="0 0 100 100"><path d="M6 50s16-26 44-26 44 26 44 26-16 26-44 26S6 50 6 50Z"/><circle cx="50" cy="50" r="13"/></svg>'+
    '</button></div>';
}
function wireEyes(){
  Array.prototype.forEach.call(document.querySelectorAll(".eye"),function(b){
    b.onclick=function(){
      var inp=$(b.dataset.for); if(!inp) return;
      var show=inp.type==="password";
      inp.type=show?"text":"password";
      b.setAttribute("aria-pressed",show?"true":"false");
      inp.focus();
    };
  });
}
function aerr(m){ var e=$("aErr"); if(e) e.textContent=m||""; }
function busy(on,label){
  var g=$("aGo"); if(!g) return;
  g.disabled=on; g.style.opacity=on?".6":"1";
  if(label) g.textContent=label;
}
function mailErr(m){
  var ko;
  if(/rate|limit|429/i.test(m)) ko="메일 발송 횟수를 넘었어요";
  else if(/sending|smtp|magic|confirmation/i.test(m)) ko="메일을 보내지 못했어요";
  else if(/not allowed|disabled/i.test(m)) ko="가입이 잠겨 있어요";
  else if(/signups not allowed|user not found|otp_disabled/i.test(m)) ko="아직 없는 계정이에요. '다음'으로 비밀번호를 만들어 가입해 주세요";
  else ko=m||"보내지 못했어요";
  A.raw=m||"";
  return ko;
}
function showRaw(){
  var e=$("aErr"); if(!e||!A.raw) return;
  var d=document.createElement("div");
  d.style.cssText="margin-top:6px;font-size:10.5px;color:#B39EAC;font-weight:400;line-height:1.5;word-break:break-all";
  d.textContent="원문: "+A.raw;
  e.appendChild(d);
}

/* 회원가입 1 — 인증번호 보내기 */
function sendCode(){
  var el=$("aMail");
  var v=el?(el.value||"").trim().toLowerCase():A.mail;
  if(!validMail(v)){ aerr("이메일 주소를 확인해 주세요"); return; }
  A.mail=v; aerr("");
  if(!cloudReady()){
    A.code=String(Math.floor(100000+Math.random()*900000));
    A.step="code"; renderAuth(); return;
  }
  busy(true,"보내는 중…");
  fetch(CLOUD.url+"/auth/v1/otp",{method:"POST",headers:sbHead(false),
    body:JSON.stringify({email:A.mail,create_user:false})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      busy(false,"인증번호 받기");
      if(!res.ok){ aerr(mailErr(res.j.msg||res.j.error_description||res.j.error||JSON.stringify(res.j))); showRaw(); return; }
      A.step="code"; renderAuth();
    }).catch(function(){ busy(false,"인증번호 받기"); aerr("연결이 안 돼요. 잠시 후 다시"); });
}

/* 비밀번호 찾기 — 재설정 인증번호 보내기 */
function sendRecover(){
  var v=($("aMail").value||"").trim().toLowerCase();
  if(!validMail(v)){ aerr("이메일 주소를 확인해 주세요"); return; }
  A.mail=v; A.recover=true; aerr("");
  if(!cloudReady()){
    store.get("acct:"+v).then(function(acc){
      if(!acc){ aerr("가입되지 않은 이메일이에요"); return; }
      A.code=String(Math.floor(100000+Math.random()*900000));
      A.step="code"; renderAuth();
    });
    return;
  }
  busy(true,"보내는 중…");
  fetch(CLOUD.url+"/auth/v1/recover",{method:"POST",headers:sbHead(false),
    body:JSON.stringify({email:A.mail})})
    .then(function(r){ return r.ok?{ok:true,j:{}}:r.json().then(function(j){ return {ok:false,j:j}; }); })
    .then(function(res){
      busy(false,"인증번호 받기");
      if(!res.ok){ aerr(mailErr(res.j.msg||res.j.error_description||JSON.stringify(res.j))); showRaw(); return; }
      A.step="code"; renderAuth();
    }).catch(function(){ busy(false,"인증번호 받기"); aerr("연결이 안 돼요"); });
}

/* 회원가입 2 — 인증번호 확인 */
function checkCode(){
  var v=($("aCode").value||"").trim();
  if(v.length!==6){ aerr("6자리를 넣어 주세요"); return; }
  if(!cloudReady()){
    if(v!==A.code){ aerr("번호가 달라요"); return; }
    A.step="newpw"; renderAuth(); return;
  }
  busy(true,"확인 중…");
  fetch(CLOUD.url+"/auth/v1/verify",{method:"POST",headers:sbHead(false),
    body:JSON.stringify({email:A.mail,token:v,type:A.recover?"recovery":"email"})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      busy(false,"확인");
      if(!res.ok||!res.j.access_token){ aerr("번호가 달라요"); return; }
      SB.token=res.j.access_token; SB.refresh=res.j.refresh_token;
      SB.uid=res.j.user&&res.j.user.id; SB.mail=(res.j.user&&res.j.user.email)||A.mail;
      localSet("sb:session",SB);
      A.step="newpw"; renderAuth();
    }).catch(function(){ busy(false,"확인"); aerr("연결이 안 돼요"); });
}

/* 회원가입 3 — 비밀번호 만들기 */
function setNewPw(){
  var pw=$("aPw").value||"";
  if(pw.length<6){ aerr("6자 이상으로 정해 주세요"); return; }
  if(pw!==($("aPw2").value||"")){ aerr("두 번 입력한 비밀번호가 달라요"); return; }
  aerr("");
  if(!cloudReady()){
    sha(pw).then(function(h){
      store.set("acct:"+A.mail,{h:h,at:Date.now()}).then(function(){
        A.recover=false; signIn(A.mail);
      });
    });
    return;
  }
  if(A.direct){
    busy(true,"가입 중…");
    fetch(CLOUD.url+"/auth/v1/signup",{method:"POST",headers:sbHead(false),
      body:JSON.stringify({email:A.mail,password:pw})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        busy(false,"가입하고 시작하기");
        if(!res.ok){
          var m=res.j.msg||res.j.error_description||"";
          if(/already|registered|exists/i.test(m)){
            aerr("이미 있는 계정이에요 · 로그인 시도 중…");
            busy(true,"로그인 중…");
            fetch(CLOUD.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:sbHead(false),
              body:JSON.stringify({email:A.mail,password:pw})})
              .then(function(r2){ return r2.json().then(function(j2){ return {ok:r2.ok,j:j2}; }); })
              .then(function(r2){
                busy(false,"가입하고 시작하기");
                if(r2.ok&&r2.j.access_token){
                  SB.token=r2.j.access_token; SB.refresh=r2.j.refresh_token;
                  SB.uid=r2.j.user&&r2.j.user.id; SB.mail=(r2.j.user&&r2.j.user.email)||A.mail;
                  localSet("sb:session",SB); A.direct=false; signIn(SB.mail); return;
                }
                aerr("이 이메일은 이미 쓰이고 있어요. 다른 이메일로 가입하거나, 비밀번호가 기억나면 로그인해 주세요");
              }).catch(function(){ busy(false,"가입하고 시작하기"); aerr("연결이 안 돼요"); });
            return;
          }
          aerr(mailErr(m)); return;
        }
        if(res.j.access_token){
          SB.token=res.j.access_token; SB.refresh=res.j.refresh_token;
          SB.uid=res.j.user&&res.j.user.id; SB.mail=(res.j.user&&res.j.user.email)||A.mail;
          localSet("sb:session",SB); A.direct=false; signIn(SB.mail); return;
        }
        aerr("메일함의 인증 링크를 누른 뒤 로그인해 주세요");
        setTimeout(function(){ A.direct=false; A.step="login"; renderAuth(); },2400);
      }).catch(function(){ busy(false,"가입하고 시작하기"); aerr("연결이 안 돼요"); });
    return;
  }
  busy(true,"저장 중…");
  fetch(CLOUD.url+"/auth/v1/user",{method:"PUT",headers:sbHead(true),
    body:JSON.stringify({password:pw})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      busy(false,"가입하고 시작하기");
      if(!res.ok){ aerr(res.j.msg||"저장하지 못했어요"); return; }
      A.recover=false; signIn(SB.mail||A.mail);
    }).catch(function(){ busy(false,"가입하고 시작하기"); aerr("연결이 안 돼요"); });
}

/* 로그인 */
function loginPw(){
  var v=($("aMail").value||"").trim().toLowerCase();
  var pw=$("aPw").value||"";
  if(!validMail(v)){ aerr("이메일 주소를 확인해 주세요"); return; }
  if(!pw){ aerr("비밀번호를 넣어 주세요"); return; }
  A.mail=v; aerr("");
  if(!cloudReady()){
    sha(pw).then(function(h){
      store.get("acct:"+v).then(function(acc){
        if(!acc){ aerr("가입되지 않은 이메일이에요"); return; }
        if(acc.h!==h){ aerr("비밀번호가 맞지 않아요"); return; }
        signIn(v);
      });
    });
    return;
  }
  busy(true,"확인 중…");
  fetch(CLOUD.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:sbHead(false),
    body:JSON.stringify({email:v,password:pw})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      busy(false,"로그인");
      if(!res.ok||!res.j.access_token){
        var m=res.j.msg||res.j.error_description||"";
        aerr(/confirm/i.test(m)?"메일함의 인증 링크를 먼저 눌러 주세요":"이메일이나 비밀번호가 맞지 않아요");
        return;
      }
      SB.token=res.j.access_token; SB.refresh=res.j.refresh_token;
      SB.uid=res.j.user&&res.j.user.id; SB.mail=(res.j.user&&res.j.user.email)||v;
      localSet("sb:session",SB);
      signIn(SB.mail);
    }).catch(function(){ busy(false,"로그인"); aerr("연결이 안 돼요. 잠시 후 다시"); });
}

function googleLogin(){
  var back=location.origin+location.pathname;
  location.href=CLOUD.url+"/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(back);
}
/* 구글에서 돌아왔을 때 #access_token 처리 */
function catchOAuth(){
  if(!location.hash||location.hash.indexOf("access_token")<0) return false;
  var q={};
  location.hash.replace(/^#/,"").split("&").forEach(function(kv){
    var p=kv.split("="); q[p[0]]=decodeURIComponent(p[1]||"");
  });
  if(!q.access_token) return false;
  SB.token=q.access_token; SB.refresh=q.refresh_token||null;
  history.replaceState(null,"",location.pathname);
  return fetch(CLOUD.url+"/auth/v1/user",{headers:sbHead(true)})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(u){
      SB.uid=u&&u.id; SB.mail=(u&&u.email)||"google";
      localSet("sb:session",SB);
      USER=SB.mail; PFX="";
      hideAuth(); boot();
      toast((SB.mail.split("@")[0])+"님, 어서 오세요 · 연동 중");
    });
}
function signIn(mail){
  USER=mail; PFX=cloudOn()?"":("u:"+mail+":");
  localSet("session",{mail:mail});
  hideAuth(); boot();
  toast(mail.split("@")[0]+"님, 어서 오세요"+(cloudOn()?" · 연동 중":""));
}
function signOut(){
  if(!confirm("로그아웃할까요? 기록은 계정에 그대로 남아 있어요.")) return;
  if(cloudOn()) flushQ();
  SB={token:null,refresh:null,uid:null,mail:null};
  localSet("sb:session",null);
  localSet("session",null);
  USER=null; PFX="";
  $("cal").classList.remove("on");
  A={step:"home",mail:"",code:"",pw:"",direct:false,recover:false};
  showAuth();
}
function boot(){
  return store.get(K("pen:prefs")).then(function(pf){
    T.saved={gel:[],pencil:[],hl:[],eraser:[]}; T.myColors=[]; T.stickerOrder=null; T.memoSize=17;
    if(pf){ if(pf.saved) T.saved=pf.saved; if(pf.colors) T.myColors=pf.colors;
      if(pf.order) T.stickerOrder=pf.order; if(pf.memoSize) T.memoSize=pf.memoSize; }
    applyMemoStyle();
  }).then(function(){ return loadDay(dkey(today)); });
}
$("acctBtn").style.display="none";
$("acctBtn").onclick=function(){
  if(USER) signOut();
  else { $("cal").classList.remove("on"); A={step:"home",mail:"",code:"",pw:"",direct:false,recover:false}; showAuth(); }
};
if(cloudReady()&&location.hash.indexOf("access_token")>=0){ catchOAuth(); }
else
localGet("sb:session").then(function(sess){
  if(cloudReady()&&sess&&sess.refresh){
    SB=sess;
    return sbRefresh().then(function(ok){
      if(ok){ USER=SB.mail; PFX=""; boot(); return true; }
      return false;
    });
  }
  return false;
}).then(function(done){
  if(done) return;
  return localGet("session").then(function(ss){
    if(ss&&ss.mail&&!cloudReady()){ USER=ss.mail; PFX="u:"+ss.mail+":"; boot(); }
    else showAuth();
  });
});
})();
</script>
<!--
============================================================
  기기 간 연동 켜는 법 (5분)
============================================================
1) supabase.com 가입 → New project (무료)

2) 왼쪽 SQL Editor 에 아래를 붙여넣고 Run:

   create table public.kv (
     user_id uuid not null default auth.uid() references auth.users on delete cascade,
     k text not null,
     v jsonb,
     updated_at timestamptz default now(),
     primary key (user_id, k)
   );
   alter table public.kv enable row level security;
   create policy "own rows" on public.kv
     for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

3) Authentication → Sign In / Providers → Email 켜기
   · "Confirm email" 켜두면 가입 시 인증번호가 메일로 가요
   · Email Templates → Confirm signup 본문에 {{ .Token }} 을 넣어야
     링크가 아니라 6자리 숫자가 옵니다

4) Project Settings → API 에서 두 값을 복사해
   이 파일 위쪽 var CLOUD={url:"", key:""} 에 넣기
     url : https://xxxx.supabase.co
     key : anon public 키 (공개돼도 되는 키예요)

5) 파일을 배포하면 끝 (netlify.com/drop 에 끌어다 놓으면 즉시 주소가 나와요)
   → 폰이든 노트북이든 같은 계정으로 로그인하면 같은 다이어리가 보여요

* CLOUD 를 비워두면 지금처럼 이 기기 안에서만 저장돼요.
* 저장 방식: kv 테이블에 사용자별로 (k, v) 한 줄씩. RLS 때문에
  다른 사람 기록은 절대 읽히지 않아요.
============================================================
-->
